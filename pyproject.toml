[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patient-voice-lab"
version = "0.1.0"
description = "A patient simulator for evidence-based voice-agent testing"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents[silero]==1.8.11",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
voice-probe = "voice_probe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
